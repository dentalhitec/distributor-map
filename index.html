<!DOCTYPE html>
<html lang="fr">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description"
    content="Carte interactive des distributeurs agréés Dentalhitec en France et à l'international." />
  <title>Distributeurs — Dentalhitec</title>
  <link rel="stylesheet" href="style.css" />
  <!-- Google Fonts via JS (chargé dans index.js) -->
</head>

<body>
  <div id="mapContainer">


    <!-- ── Sidebar ────────────────────────────────────────────── -->
    <div id="sidebar">

      <!-- Header avec logo -->
      <div class="sidebar-header">
        <!-- Champ de recherche -->
        <div id="search-container">
          <div class="search-wrapper">
            <span class="search-icon" aria-hidden="true">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                stroke-linecap="round" stroke-linejoin="round">
                <circle cx="11" cy="11" r="8" />
                <line x1="21" y1="21" x2="16.65" y2="16.65" />
              </svg>
            </span>
            <input id="place-search" type="text" placeholder="Rechercher par ville ou code postal…" autocomplete="off"
              aria-label="Rechercher un distributeur" />
          </div>
        </div>
      </div>

      <!-- Label résultats (injecté dynamiquement aussi) -->
      <div id="results-label" style="display:none;"></div>

      <!-- Liste des distributeurs -->
      <ul id="places-list" role="list" aria-label="Liste des distributeurs"></ul>

      <!-- Détail d'un distributeur -->
      <div id="place-details" style="display:none;"></div>

      <!-- Pied de sidebar -->
      <div class="sidebar-footer">
        <span class="sidebar-footer-text">Réseau mondial Dentalhitec</span>
        <span class="sidebar-footer-dot" title="Réseau actif"></span>
      </div>

    </div><!-- /sidebar -->

    <!-- ── Carte ───────────────────────────────────────────────── -->
    <div id="map" aria-label="Carte des distributeurs" style="height:100%"></div>

  </div><!-- /mapContainer -->

  <script src="index.js"></script>
</body>

</html>
